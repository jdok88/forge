name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Releases 에 APK 를 올리기 위해 필요
    steps:
      - uses: actions/checkout@v4

      # 이 세 값은 브라우저 번들에 그대로 실리는 공개 값이라 Secrets 가 아니라 Variables 로 둔다.
      # 실제 접근 제어는 Supabase RLS 가 서버에서 강제한다.
      - name: 필수 저장소 변수 확인
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: |
          missing=0
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_VAPID_PUBLIC_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required repository variable: $v (Settings → Secrets and variables → Actions → Variables)"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 웹 빌드
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Capacitor 동기화
        run: npx cap sync android

      - name: 릴리스 서명 키 복원
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_B64"
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/forge.p12"

      - name: APK 빌드 (릴리스 서명)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/forge.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 서명 확인
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: forge-alarm-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 제3자가 로그인 없이 받을 수 있도록 Releases 에 고정 주소로 올린다.
      # 아티팩트는 90일 뒤 만료되고 GitHub 로그인을 요구해 배포용으로 못 쓴다.
      - name: Releases 에 최신 APK 게시
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Forge 알람 (최신)
          body: |
            안드로이드 앱 최신 빌드입니다.

            **설치 방법**
            1. 아래 `app-release.apk` 를 폰에서 다운로드
            2. 파일을 탭하면 "출처를 알 수 없는 앱" 경고가 뜹니다 — 설정에서 허용하고 설치
            3. Play 스토어를 거치지 않은 앱이라 나오는 정상적인 경고입니다

            웹 버전: https://forgealarm.pages.dev
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
